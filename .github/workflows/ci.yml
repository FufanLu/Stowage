name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  console:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: typecheck and build
        run: npm run build

  kind:
    # The Docker image, the Helm chart and a rolling restart, on a real
    # Kubernetes (kind) cluster.
    runs-on: ubuntu-24.04
    needs: [console]
    steps:
      - uses: actions/checkout@v4
      - name: install kind
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind version
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint deploy/helm/stowage
      - name: build, install, smoke test
        run: KIND_CLUSTER=stowage scripts/kind-smoke.sh
      - name: logs on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl logs -l app.kubernetes.io/name=stowage --tail 80 --prefix

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: tests
        run: cargo nextest run --workspace --locked --profile ci
      - name: doc tests
        run: cargo test --workspace --doc --locked

  simulation:
    # Fixed seeds run in `test`; this job explores fresh random schedules on every push.
    # A failure prints `STOWAGE_SIM_SEED=<n>`, which reproduces it locally.
    runs-on: ubuntu-24.04
    env:
      STOWAGE_SIM_SEEDS: "100"
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --release --profile sim -E 'binary(simulation)'

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
