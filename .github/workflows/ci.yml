name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  console:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: typecheck and build
        run: npm run build

  kind:
    # The Docker image, the Helm chart and a rolling restart, on a real
    # Kubernetes (kind) cluster.
    runs-on: ubuntu-24.04
    needs: [console]
    steps:
      - uses: actions/checkout@v4
      - name: install kind
        run: |
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind version
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint deploy/helm/stowage
      - name: build, install, smoke test
        run: KIND_CLUSTER=stowage scripts/kind-smoke.sh
      - name: logs on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl logs -l app.kubernetes.io/name=stowage --tail 80 --prefix

  compat:
    # Conveyor's and Milkrun's real Flyway migrations, applied by Flyway 13
    # over pgjdbc to a three-node cluster, then their constraints exercised.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get install -y --no-install-recommends postgresql-client
      - run: cargo build --release --locked -p stowd
      - name: start a three-node cluster
        run: |
          P=1=127.0.0.1:7001,2=127.0.0.1:7002,3=127.0.0.1:7003
          for i in 1 2 3; do
            ./target/release/stowd --node-id $i --listen 127.0.0.1:700$i --peers $P \
              --data-dir /tmp/stowage/n$i --pg-listen 127.0.0.1:548$i \
              --ddb-listen 127.0.0.1:848$i --http-listen 127.0.0.1:948$i > /tmp/n$i.log 2>&1 &
          done
          for _ in $(seq 1 30); do curl -fsS 127.0.0.1:9481/health && break; sleep 1; done
      - name: flyway
        run: tests/compat/flyway/run.sh 5481
      - name: AWS SDK for Java v2 (Conveyor tracking-svc's calls)
        working-directory: tests/compat/dynamodb-java
        run: mvn -q -B compile exec:java -Dexec.args=http://127.0.0.1:8481
      - name: node logs on failure
        if: failure()
        run: tail -n 60 /tmp/n*.log

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: tests
        run: cargo nextest run --workspace --locked --profile ci
      - name: doc tests
        run: cargo test --workspace --doc --locked

  simulation:
    # Fixed seeds run in `test`; this job explores fresh random schedules on every push.
    # A failure prints `STOWAGE_SIM_SEED=<n>`, which reproduces it locally.
    runs-on: ubuntu-24.04
    env:
      STOWAGE_SIM_SEEDS: "100"
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --release --profile sim -E 'binary(simulation)'

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
