# Keep a Raft quorum through voluntary disruptions (node drains, upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "stowage.name" . }}
  labels: {{- include "stowage.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{- include "stowage.labels" . | nindent 6 }}
