[package]
name = "stowage-storage"
description = "Stowage storage engine: B+Tree, buffer pool, WAL with full-page writes, crash recovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
